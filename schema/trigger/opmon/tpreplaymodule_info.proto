syntax = "proto3";

package dunedaq.trigger.opmon;

// Message representing TP Replay Module Information
message TPReplayModuleInfo {
  uint32 tp_made_count = 1;         // Number of TPs read/made from file
  uint32 tpv_made_count = 2;        // Number of TP vectors read/made from file
  uint32 tpv_failed_sent_count = 3; // Number of TP vectors that failed to send
}
